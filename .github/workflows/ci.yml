name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build tokens (dist/ requis par web et api)
        run: npm run build -w packages/tokens
      - name: Lint (tsc)
        run: npm run lint
      - name: Tests unitaires (API + tokens)
        run: npm test
      - name: Build
        run: npm run build
